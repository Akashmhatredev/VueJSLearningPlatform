<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn Vue.js from absolute zero to production: plain-English lessons, live playgrounds, animated visualizers, quizzes and interview practice." />
    <meta name="theme-color" content="#fafaf8" />
    <title>Vue/Zero — Vue.js from zero to ship it</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      ;(function () {
        try {
          var raw = localStorage.getItem('vlp:preferences')
          var prefs = raw ? JSON.parse(raw).data || {} : {}
          var theme = prefs.theme || 'system'
          if (theme === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          if (prefs.motion && prefs.motion !== 'system') document.documentElement.dataset.motion = prefs.motion
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <noscript>Vue/Zero is an interactive course and needs JavaScript enabled.</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
